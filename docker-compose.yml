services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: upr_rank
      POSTGRES_PASSWORD: upr_rank
      POSTGRES_DB: upr_rank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upr_rank -d upr_rank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend_core
    environment:
      DATABASE_URL: postgresql+psycopg2://upr_rank:upr_rank@postgres:5432/upr_rank
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: